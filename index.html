<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Calculadora EQUA</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="calculadora">
    <div class="visor">
      <div id="expressao"></div>
      <div id="resultado"></div>
    </div>
    <div class="botoes">
      <button onclick="add('7')">7</button>
      <button onclick="add('8')">8</button>
      <button onclick="add('9')">9</button>
      <button onclick="add('÷')">÷</button>

      <button onclick="add('4')">4</button>
      <button onclick="add('5')">5</button>
      <button onclick="add('6')">6</button>
      <button onclick="add('×')">×</button>

      <button onclick="add('1')">1</button>
      <button onclick="add('2')">2</button>
      <button onclick="add('3')">3</button>
      <button onclick="add('-')">-</button>

      <button onclick="add('0')">0</button>
      <button onclick="add('.')">.</button>
      <button onclick="calcular()">=</button>
      <button onclick="add('+')">+</button>

      <button onclick="limpar()" class="limpar">C</button>
    </div>
  </div>

  <script>
    let expressao = "";

    function add(caractere) {
      expressao += caractere;
      document.getElementById("expressao").innerText = expressao;
    }

    function limpar() {
      expressao = "";
      document.getElementById("expressao").innerText = "";
      document.getElementById("resultado").innerText = "";
    }

    function calcular() {
      fetch('http://localhost:5000/calcular', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ expressao: expressao })
      })
      .then(res => res.json())
      .then(data => {
        document.getElementById("resultado").innerText = data.resultado;
      })
      .catch(() => {
        document.getElementById("resultado").innerText = "Erro";
      });
    }
  </script>
</body>
</html>
